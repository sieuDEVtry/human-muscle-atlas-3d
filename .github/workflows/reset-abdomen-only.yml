name: Reset abdomen only

on:
  push:
    paths:
      - '.github/workflows/reset-abdomen-only.yml'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore old abdomen behavior, keep bilateral rotation
        run: |
          git checkout a73f7b65c5f3b451ae333f9191c95d91a7c32c07 -- src/App.jsx
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text()
          text = text.replace('minAzimuthAngle={-Math.PI}\n                maxAzimuthAngle={0}', 'minAzimuthAngle={-Math.PI / 2}\n                maxAzimuthAngle={Math.PI / 2}')
          path.write_text(text)
          PY
          npm ci
          npm run build
          git config user.name "sieuDEVtry"
          git config user.email "ptkien.280404@gmail.com"
          git add src/App.jsx
          git commit -m "Reset abdomen to original mesh, keep bilateral rotation"
          git push
